<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مدیریت ریسک معاملات</title>
  
  <!-- متا تگ‌های مخصوص برنامه (PWA) -->
  <meta name="theme-color" content="#f59e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- آیکون برنامه (باید عکس رو آپلود کنی) -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Tahoma, 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #fff;
    }
    .card {
      background: #262640;
      border-radius: 0; /* حذف گردی لبه‌ها برای تمام‌صفحه */
      padding: 24px;
      width: 100%;
      height: 100vh; /* کل صفحه رو پر کن */
      max-width: 420px;
      margin: 0 auto;
      box-shadow: none; /* سایه رو حذف کن */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      margin: 0 0 4px;
    }
    .subtitle {
      text-align: center;
      color: #a0a0b8;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #d0d0e0;
    }
    .input-wrap {
      position: relative;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #3a3a55;
      background: #1c1c30;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input[type="number"]:focus {
      border-color: #f59e0b;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #f59e0b;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1e1e2f;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    button:active {
      background: #d48c0a;
    }
    .result {
      margin-top: 18px;
      background: #1c1c30;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 1.2rem;
      border: 1px solid #3a3a55;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result span {
      color: #f59e0b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📊 مدیریت ریسک معاملات</h1>
    <div class="subtitle">محاسبه حجم معامله بر اساس ریسک</div>

    <div class="field">
      <label>💰 سرمایه (دلار)</label>
      <div class="input-wrap">
        <input type="number" id="capital" placeholder="مثال: 1000" value="1000">
      </div>
    </div>

    <div class="field">
      <label>📉 درصد ریسک (%)</label>
      <div class="input-wrap">
        <input type="number" id="riskPercent" placeholder="مثال: 2" value="2">
      </div>
    </div>

    <div class="field">
      <label>⚡ اهرم (×)</label>
      <div class="input-wrap">
        <input type="number" id="leverage" placeholder="مثال: 10" value="10">
      </div>
    </div>

    <div class="field">
      <label>🛑 استاپ لاس (%)</label>
      <div class="input-wrap">
        <input type="number" id="stopLoss" placeholder="مثال: 5" value="5">
      </div>
    </div>

    <button onclick="calculate()">🧮 محاسبه کن</button>

    <div class="result" id="result">
      حجم معامله: <span id="output">۰</span>
    </div>
  </div>

  <script>
    function calculate() {
      const capital = parseFloat(document.getElementById('capital').value) || 0;
      const riskPercent = parseFloat(document.getElementById('riskPercent').value) || 0;
      const leverage = parseFloat(document.getElementById('leverage').value) || 1;
      const stopLoss = parseFloat(document.getElementById('stopLoss').value) || 1;

      if (capital <= 0 || riskPercent <= 0 || stopLoss <= 0) {
        document.getElementById('output').textContent = 'مقادیر معتبر وارد کن';
        return;
      }

      const riskAmount = capital * (riskPercent / 100);
      const positionSize = (riskAmount * leverage) / (stopLoss / 100);
      document.getElementById('output').textContent = positionSize.toFixed(2);
    }
    // محاسبه اولیه هنگام بارگذاری
    window.onload = calculate;
  </script>
</body>
</html>
