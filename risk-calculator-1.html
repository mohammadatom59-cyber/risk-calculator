<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مدیریت ریسک معاملات</title>
<meta name="theme-color" content="#f59e0b">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2a2a40);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .card {
    background: #262640;
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  h1 {
    text-align: center;
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: #a0a0b8;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .field {
    margin-bottom: 14px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: #d0d0e0;
  }
  .input-wrap {
    position: relative;
  }
  input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #3a3a55;
    background: #1c1c30;
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
  }
  input[type="number"]:focus {
    border-color: #f59e0b;
  }
  .unit {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
    font-size: 0.85rem;
    pointer-events: none;
  }
  .hint {
    font-size: 0.75rem;
    color: #f87171;
    margin-top: 4px;
    min-height: 14px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary {
    background: #f59e0b;
    color: #1c1c30;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    background: transparent;
    color: #a0a0b8;
    border: 1px solid #3a3a55;
    margin-top: 10px;
  }
  .result-box {
    background: #1c1c30;
    border-radius: 14px;
    padding: 18px;
    margin-top: 20px;
    text-align: center;
  }
  .result-title {
    font-size: 0.85rem;
    color: #a0a0b8;
    margin-bottom: 6px;
  }
  .result-value {
    font-size: 1.6rem;
    font-weight: bold;
    color: #f59e0b;
  }
  .breakdown {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    gap: 10px;
  }
  .breakdown div {
    flex: 1;
    background: #262640;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .breakdown .label {
    font-size: 0.7rem;
    color: #888;
  }
  .breakdown .val {
    font-size: 0.95rem;
    font-weight: bold;
    margin-top: 4px;
  }
  .formula {
    margin-top: 18px;
    font-size: 0.75rem;
    color: #6b6b85;
    text-align: center;
    line-height: 1.6;
  }
  .saved-note {
    text-align: center;
    font-size: 0.72rem;
    color: #4ade80;
    margin-top: 10px;
    min-height: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📊 مدیریت ریسک معاملات</h1>
    <div class="subtitle">محاسبه حجم معامله بر اساس ریسک</div>

    <div class="field">
      <label>💰 سرمایه <span style="color:#666">(دلار)</span></label>
      <div class="input-wrap">
        <input type="number" id="capital" placeholder="مثلاً 1000" inputmode="decimal">
      </div>
      <div class="hint" id="err-capital"></div>
    </div>

    <div class="field">
      <label>⚠️ درصد ریسک <span style="color:#666">(%)</span></label>
      <div class="input-wrap">
        <input type="number" id="riskPercent" placeholder="مثلاً 2" inputmode="decimal">
      </div>
      <div class="hint" id="err-riskPercent"></div>
    </div>

    <div class="field">
      <label>⚡ اهرم <span style="color:#666">(×)</span></label>
      <div class="input-wrap">
        <input type="number" id="leverage" placeholder="مثلاً 10" inputmode="decimal">
      </div>
      <div class="hint" id="err-leverage"></div>
    </div>

    <div class="field">
      <label>🛑 استاپ لاس <span style="color:#666">(%)</span></label>
      <div class="input-wrap">
        <input type="number" id="stopLoss" placeholder="مثلاً 5" inputmode="decimal">
      </div>
      <div class="hint" id="err-stopLoss"></div>
    </div>

    <button class="btn-primary" onclick="calculate()">محاسبه کن</button>
    <button class="btn-secondary" onclick="clearAll()">🔄 پاک کردن</button>

    <div class="saved-note" id="savedNote"></div>

    <div class="result-box">
      <div class="result-title">حجم معامله</div>
      <div class="result-value" id="resultValue">0.00 دلار</div>

      <div class="breakdown">
        <div>
          <div class="label">مقدار ریسک</div>
          <div class="val" id="riskAmountVal">—</div>
        </div>
        <div>
          <div class="label">اهرم × استاپ</div>
          <div class="val" id="leverageStopVal">—</div>
        </div>
        <div>
          <div class="label">درصد از سرمایه</div>
          <div class="val" id="percentOfCapitalVal">—</div>
        </div>
      </div>
    </div>

    <div class="formula">
      فرمول: ((سرمایه × درصد ریسک ÷ ۱۰۰) ÷ (اهرم × استاپ لاس ÷ ۱۰۰))
    </div>
  </div>

<script>
  const fields = ['capital', 'riskPercent', 'leverage', 'stopLoss'];
  const STORAGE_KEY = 'riskCalculatorInputs';

  // بارگذاری مقادیر ذخیره‌شده هنگام باز شدن صفحه
  function loadSaved() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      fields.forEach(id => {
        if (saved[id] !== undefined && saved[id] !== '') {
          document.getElementById(id).value = saved[id];
        }
      });
      // اگر مقادیر معتبر بودن، نتیجه رو هم دوباره محاسبه کن
      if (fields.every(id => document.getElementById(id).value !== '')) {
        calculate(true);
      }
    } catch (e) {
      console.error('خطا در بارگذاری اطلاعات ذخیره‌شده', e);
    }
  }

  // ذخیره‌سازی خودکار با هر تغییر ورودی
  function saveInputs() {
    const data = {};
    fields.forEach(id => {
      data[id] = document.getElementById(id).value;
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const note = document.getElementById('savedNote');
    note.textContent = '✓ ذخیره شد';
    clearTimeout(window._savedNoteTimeout);
    window._savedNoteTimeout = setTimeout(() => { note.textContent = ''; }, 1200);
  }

  fields.forEach(id => {
    document.getElementById(id).addEventListener('input', saveInputs);
  });

  function showError(id, msg) {
    document.getElementById('err-' + id).textContent = msg;
  }
  function clearErrors() {
    fields.forEach(id => showError(id, ''));
  }

  function calculate(silent) {
    clearErrors();
    const capital = parseFloat(document.getElementById('capital').value);
    const riskPercent = parseFloat(document.getElementById('riskPercent').value);
    const leverage = parseFloat(document.getElementById('leverage').value);
    const stopLoss = parseFloat(document.getElementById('stopLoss').value);

    let hasError = false;
    if (isNaN(capital) || capital <= 0) { showError('capital', 'لطفاً سرمایه را وارد کنید'); hasError = true; }
    if (isNaN(riskPercent) || riskPercent <= 0) { showError('riskPercent', 'لطفاً درصد ریسک را وارد کنید'); hasError = true; }
    if (isNaN(leverage) || leverage <= 0) { showError('leverage', 'لطفاً اهرم را وارد کنید'); hasError = true; }
    if (isNaN(stopLoss) || stopLoss <= 0) { showError('stopLoss', 'لطفاً استاپ لاس را وارد کنید'); hasError = true; }

    if (hasError) {
      if (!silent) {
        document.getElementById('resultValue').textContent = '0.00 دلار';
        document.getElementById('riskAmountVal').textContent = '—';
        document.getElementById('leverageStopVal').textContent = '—';
        document.getElementById('percentOfCapitalVal').textContent = '—';
      }
      return;
    }

    const riskAmount = (capital * riskPercent) / 100;
    const leverageStop = leverage * (stopLoss / 100);
    const tradeVolume = riskAmount / leverageStop;
    const percentOfCapital = (tradeVolume / capital) * 100;

    document.getElementById('resultValue').textContent = tradeVolume.toFixed(2) + ' دلار';
    document.getElementById('riskAmountVal').textContent = riskAmount.toFixed(2) + ' $';
    document.getElementById('leverageStopVal').textContent = leverageStop.toFixed(2);
    document.getElementById('percentOfCapitalVal').textContent = percentOfCapital.toFixed(1) + ' %';
  }

  function clearAll() {
    fields.forEach(id => document.getElementById(id).value = '');
    clearErrors();
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('resultValue').textContent = '0.00 دلار';
    document.getElementById('riskAmountVal').textContent = '—';
    document.getElementById('leverageStopVal').textContent = '—';
    document.getElementById('percentOfCapitalVal').textContent = '—';
    document.getElementById('savedNote').textContent = '🗑 پاک شد';
    setTimeout(() => { document.getElementById('savedNote').textContent = ''; }, 1200);
  }

  // اجرا هنگام بارگذاری صفحه
  loadSaved();
</script>
</body>
</html>
